name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [app.py, core.py, requirements.txt, .github/workflows/build.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Self-checks
        run: python test_core.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Self-checks
        run: python test_core.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name NovelTranslator app.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: NovelTranslator-windows
          path: dist/NovelTranslator.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NovelTranslator-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/NovelTranslator.exe